name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the tests read YAML fixtures (formalization.yaml, catalogues): PyYAML is the `yaml` extra
      - run: pip install 'pyyaml>=6'
      - run: python -m unittest discover -s tests -v
      - name: The package installs, with no dependencies
        run: |
          pip install .
          evidence-core --help > /dev/null
