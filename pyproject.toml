[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-core"
version = "0.4.0"
description = "Pure functions over LeanTrustBuilders datasets and evidence records"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
evidence-core = "evidence_core.cli:main"

[tool.setuptools]
packages = ["evidence_core"]
